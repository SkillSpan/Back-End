name: CI

on:
  push:
    branches: [main, develop, 'feature/**']
  pull_request:
    branches: [main, develop]

jobs:
  ci:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, dom, fileinfo, sqlite3, pdo_sqlite
          coverage: none

      - name: Check PHP syntax
        run: |
          set -e
          find app routes config database bootstrap -name '*.php' -print0 \
            | xargs -0 -n1 -P4 php -l > /dev/null

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Copy .env
        run: cp .env.example .env

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Install npm dependencies
        run: npm install

      - name: Build frontend assets
        run: npm run build

      - name: Generate app key
        run: php artisan key:generate

      - name: Create SQLite database file
        id: prepare
        run: touch database/database.sqlite

      - name: Run Laravel Pint (code style check)
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        run: vendor/bin/pint --test

      - name: Run PHPUnit tests
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        run: php artisan test
